name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]

env:
  IMAGE_NAME: vaibhav171201/react-app

jobs:
  # CI: Build & Push Docker Image
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # CD: Simulated Deploy Docker Image
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Simulate deployment
        run: |
          echo "Deployment step: Pulling Docker image from Docker Hub"
          echo "docker pull ${{ env.IMAGE_NAME }}:latest"
          echo "docker stop react-app || true"
          echo "docker rm react-app || true"
          echo "docker run -d --name react-app -p 80:80 ${{ env.IMAGE_NAME }}:latest"
          echo "Note: No actual server available, so this step is only illustrative"
